<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <title>Yeba-CSS</title>
    <style id="dynamic-styles"></style>
</head>

<body>
    <header class="main-site-header">
        <div class="logo">Yeba-CSS</div>
        <nav>
            <ul>
                <li><a href="#">Accueil</a></li>
                <li><a href="#">Nos situations</a></li>
                <li><a href="#">A propos</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <div class="app-wrapper">
        <div class="panel game-view-panel">
            <header class="panel-header">
                <button class="icon-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <h2>Game View</h2>
                <button class="icon-btn settings-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg>
                </button>
            </header>

            <div class="game-content">
                <div class="level-title">Level 1: Position Items</div>
                
                <div class="game-area">
                    <div class="grid-bg"></div>

                    <div class="target-container">
                        <div class="target"></div>
                    </div>

                    <div id="container" class="items-container">
                        <div class="item"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel code-editor-panel">
            <header class="panel-header">
                <button class="icon-btn code-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="16 18 22 12 16 6"></polyline>
                        <polyline points="8 6 2 12 8 18"></polyline>
                    </svg>
                </button>
                <h2>Code Editor</h2>
                <div class="spacer"></div>
            </header>
            <div class="level-explication">
                <p><strong>Objectif :</strong> Utilisez les propriétés <code class="inline-code">justify-content</code> et <code class="inline-code">align-items</code> pour déplacer le carré sur la cible.</p>
            </div>

            <div class="editor-content">
                <div class="code-block">
                    <textarea id="code" placeholder="Écris ton CSS ici..."></textarea>
                </div>

                <button class="validate-btn">VALIDATE</button>
            </div>
        </div>
    </div>
    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script>
        var editor = CodeMirror.fromTextArea(document.getElementById("code"), {
            mode: "css",
            lineNumbers: true,
            theme: "default"
        });
        
        // Initial value
        editor.setValue("#container {\n  display: flex; \n}");

        // Function to apply CSS
        function applyCSS() {
            var css = editor.getValue();
            document.getElementById('dynamic-styles').innerHTML = css;
            
            // Check for success after layout recalculation
            setTimeout(checkWin, 50);
        }

        function checkWin() {
            var item = document.querySelector('.item');
            var target = document.querySelector('.target');
            
            if (!item || !target) return;
            
            var itemRect = item.getBoundingClientRect();
            var targetRect = target.getBoundingClientRect();
            
            // Check if positions match closely (e.g. within 2px)
            if (Math.abs(itemRect.top - targetRect.top) < 2 && Math.abs(itemRect.left - targetRect.left) < 2) {
                item.classList.add('success');
            } else {
                item.classList.remove('success');
            }
        }

        // Apply on change and on load
        editor.on('change', applyCSS);
        applyCSS();
        
        // Optional: click validate button to apply (if they prefer manual validation)
        document.querySelector('.validate-btn').addEventListener('click', applyCSS);
    </script>
</body>

</html>
