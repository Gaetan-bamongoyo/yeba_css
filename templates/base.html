{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nayekola{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <header class="main-site-header">
        <a class="logo" href="{% url 'home' %}">Nayekola</a>
        <button
            class="nav-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="site-nav"
            aria-label="Ouvrir le menu">
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
        </button>
        <nav id="site-nav" class="site-nav">
            <ul>
                <li><a href="{% url 'home' %}">Accueil</a></li>
                <li><a href="{% url 'home' %}#situations">Nos jeux</a></li>
                <li><a href="{% url 'about' %}">À propos</a></li>
                <li><a href="{% url 'contact' %}">Contact</a></li>
            </ul>
        </nav>
    </header>

    {% block content %}{% endblock %}

    <footer class="site-footer">
        <div class="site-footer-inner">
            <p>&copy; {% now "Y" %} Nayekola. Tous droits réservés.</p>
            <nav class="site-footer-nav" aria-label="Pied de page">
                <a href="{% url 'about' %}">À propos</a>
                <a href="{% url 'contact' %}">Contact</a>
            </nav>
        </div>
    </footer>

    <script src="{% static 'js/nav.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
