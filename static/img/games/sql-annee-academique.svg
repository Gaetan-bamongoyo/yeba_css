<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Sauver l'annee academique">
  <defs>
    <linearGradient id="aa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14233d"/>
      <stop offset="55%" stop-color="#1f3d6b"/>
      <stop offset="100%" stop-color="#2a5f8f"/>
    </linearGradient>
    <linearGradient id="aa-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#e6b422"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#aa-bg)"/>

  <!-- soft glow -->
  <circle cx="520" cy="90" r="90" fill="#f5c542" opacity="0.12"/>
  <circle cx="120" cy="320" r="110" fill="#4ea1d3" opacity="0.10"/>

  <!-- university facade -->
  <rect x="70" y="150" width="220" height="150" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
  <polygon points="60,150 180,95 300,150" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <rect x="95" y="185" width="36" height="55" rx="4" fill="rgba(157,212,255,0.35)"/>
  <rect x="147" y="185" width="36" height="55" rx="4" fill="rgba(157,212,255,0.35)"/>
  <rect x="199" y="185" width="36" height="55" rx="4" fill="rgba(157,212,255,0.35)"/>
  <rect x="155" y="250" width="50" height="50" rx="4" fill="rgba(255,255,255,0.18)"/>

  <!-- columns -->
  <rect x="88" y="150" width="12" height="150" fill="rgba(255,255,255,0.2)"/>
  <rect x="260" y="150" width="12" height="150" fill="rgba(255,255,255,0.2)"/>

  <!-- broken server / database cylinder -->
  <ellipse cx="400" cy="155" rx="70" ry="22" fill="#4db8d4"/>
  <path d="M330 155 v70 c0 14 31 26 70 26 s70-12 70-26 v-70" fill="none" stroke="#9de4ea" stroke-width="10"/>
  <path d="M345 175 h50 M345 195 h70" stroke="rgba(255,255,255,0.35)" stroke-width="4" stroke-linecap="round"/>
  <!-- crack -->
  <path d="M410 145 l12 22 -10 14 16 20" fill="none" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/>

  <!-- clock 16:00 -->
  <circle cx="530" cy="210" r="58" fill="rgba(15,30,55,0.55)" stroke="url(#aa-gold)" stroke-width="6"/>
  <circle cx="530" cy="210" r="6" fill="#ffe08a"/>
  <line x1="530" y1="210" x2="530" y2="165" stroke="#ffe08a" stroke-width="5" stroke-linecap="round"/>
  <line x1="530" y1="210" x2="568" y2="210" stroke="#ffe08a" stroke-width="5" stroke-linecap="round"/>
  <text x="530" y="278" text-anchor="middle" fill="#ffe08a" font-family="Georgia, serif" font-size="18" font-weight="700">16:00</text>

  <!-- caption -->
  <text x="48" y="360" fill="rgba(255,255,255,0.95)" font-family="Georgia, serif" font-size="22">
    SELECT admissibles FROM deliberations
  </text>
</svg>
